name: Autonomous Day & Night Studio CI

on:
  schedule:
    # Chạy tự động ngày & đêm: 00:00, 06:00, 12:00, 18:00 UTC (tương ứng 07:00, 13:00, 19:00, 01:00 giờ Việt Nam)
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  autonomous-verification:
    runs-on: ubuntu-latest
    name: Autonomous Health & Task Verification
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint Verification (oxlint)
        run: npm run lint

      - name: Game Engine Test Suite
        run: npm test

      - name: Production Bundle Build
        env:
          GITHUB_ACTIONS: 'true'
        run: npm run build

      - name: Autonomous Studio Heartbeat Check
        run: npm run daemon

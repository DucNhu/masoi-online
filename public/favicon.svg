<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Night Sky Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e1065" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Warm Golden Moon Glow -->
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </radialGradient>

    <!-- Campfire Flame Gradient -->
    <linearGradient id="fireGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>

    <!-- Wolf Fur Gradient (Warm Silver-Blue) -->
    <linearGradient id="furGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Ear Inner Pink -->
    <linearGradient id="earInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fce7f3" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Scout Scarf Gradient -->
    <linearGradient id="scarfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Amber Eye Gradient -->
    <radialGradient id="amberEye" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </radialGradient>
  </defs>

  <!-- Background: Indigo Night Sky with rx=24 -->
  <rect width="100" height="100" rx="24" fill="url(#bgGrad)" />

  <!-- Twinkling Background Stars -->
  <circle cx="18" cy="22" r="1.2" fill="#fef08a" opacity="0.8" />
  <circle cx="84" cy="24" r="1.2" fill="#fef08a" opacity="0.8" />
  <circle cx="22" cy="40" r="0.8" fill="#ffffff" opacity="0.6" />

  <!-- Warm Golden Crescent Moon in Background -->
  <path d="M74 12 A 20 20 0 1 0 88 42 A 16 16 0 1 1 74 12 Z" fill="url(#moonGlow)" opacity="0.95" />

  <!-- Campfire Sparks & Flames in Background / Side -->
  <path d="M80 82 C78 74, 83 69, 84 64 C87 70, 91 72, 89 79 C88 83, 83 84, 80 82 Z" fill="url(#fireGrad)" opacity="0.9" />
  <circle cx="87" cy="58" r="1.4" fill="#fde047" opacity="0.9" />
  <circle cx="76" cy="66" r="1.0" fill="#f97316" opacity="0.85" />
  <circle cx="83" cy="51" r="0.8" fill="#fef08a" opacity="0.85" />

  <!-- Chibi Wolf Body / Rounded Shoulders -->
  <path d="M26 86 C26 70, 74 70, 74 86 C74 90, 26 90, 26 86 Z" fill="url(#furGrad)" />

  <!-- Wolf Ears -->
  <!-- Left Ear -->
  <path d="M25 44 L31 18 C36 16, 42 24, 43 32 Z" fill="url(#furGrad)" />
  <path d="M29 40 L33 22 C37 21, 40 26, 41 33 Z" fill="url(#earInner)" opacity="0.85" />
  <!-- Right Ear -->
  <path d="M75 44 L69 18 C64 16, 58 24, 57 32 Z" fill="url(#furGrad)" />
  <path d="M71 40 L67 22 C63 21, 60 26, 59 33 Z" fill="url(#earInner)" opacity="0.85" />

  <!-- Chibi Wolf Head (Round & Chubby) -->
  <ellipse cx="50" cy="48" rx="25" ry="23" fill="url(#furGrad)" />

  <!-- Fluffy Cheeks Tufts -->
  <path d="M24 50 C21 52, 22 56, 25 57 C22 58, 23 62, 27 61 Z" fill="url(#furGrad)" />
  <path d="M76 50 C79 52, 78 56, 75 57 C78 58, 77 62, 73 61 Z" fill="url(#furGrad)" />

  <!-- Chubby Muzzle & Cheeks (Soft Warm Cream) -->
  <ellipse cx="37" cy="54" rx="12" ry="10" fill="#f8fafc" />
  <ellipse cx="63" cy="54" rx="12" ry="10" fill="#f8fafc" />
  <ellipse cx="50" cy="56" rx="12" ry="9" fill="#f8fafc" />

  <!-- Sweet Blushing Cheeks -->
  <ellipse cx="33" cy="55" rx="3.5" ry="2.2" fill="#f472b6" opacity="0.55" />
  <ellipse cx="67" cy="55" rx="3.5" ry="2.2" fill="#f472b6" opacity="0.55" />

  <!-- Big Round Warm Amber Eyes (Hiền hòa, long lanh) -->
  <!-- Left Eye -->
  <ellipse cx="39" cy="46" rx="4.8" ry="5.8" fill="url(#amberEye)" />
  <ellipse cx="39" cy="46.5" rx="3.4" ry="4.2" fill="#451a03" />
  <!-- Left Eye Catchlights (Đốm sáng trắng lấp lánh) -->
  <circle cx="37.5" cy="44" r="1.8" fill="#ffffff" />
  <circle cx="40.5" cy="48" r="0.8" fill="#ffffff" />

  <!-- Right Eye -->
  <ellipse cx="61" cy="46" rx="4.8" ry="5.8" fill="url(#amberEye)" />
  <ellipse cx="61" cy="46.5" rx="3.4" ry="4.2" fill="#451a03" />
  <!-- Right Eye Catchlights -->
  <circle cx="59.5" cy="44" r="1.8" fill="#ffffff" />
  <circle cx="62.5" cy="48" r="0.8" fill="#ffffff" />

  <!-- Cute Nose (Bo tròn ngọt ngào) -->
  <path d="M47.5 52 C48.5 51, 51.5 51, 52.5 52 C53.5 53.5, 51 55, 50 55 C49 55, 46.5 53.5, 47.5 52 Z" fill="#334155" />

  <!-- Gentle Happy Smile (Mỉm cười tươi tắn) -->
  <path d="M45.5 56.5 Q48 59, 50 57 Q52 59, 54.5 56.5" stroke="#334155" stroke-width="1.3" stroke-linecap="round" fill="none" />

  <!-- Scout Neckerchief (Khăn quàng cổ đỏ cam hướng đạo sinh) -->
  <path d="M33 65 C40 64, 60 64, 67 65 L57 78 C52 82, 48 82, 43 78 Z" fill="url(#scarfGrad)" />
  <!-- Scarf Knot / Ring -->
  <ellipse cx="50" cy="69" rx="3" ry="2.2" fill="#fde047" stroke="#ea580c" stroke-width="0.6" />
</svg>
